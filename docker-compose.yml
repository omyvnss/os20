name: os20

# Secrets come from .env next to this file (install.sh and the CLI generate it).
# APP_SECRET signs sessions and encrypts stored API keys: never change it after
# the first start, or saved keys can no longer be decrypted.
x-os20-env: &os20-env
  # production turns off the GraphQL playground, unauthenticated introspection
  # and debug error details. Never ship "development" here.
  NODE_ENV: production
  PG_DATABASE_URL: postgres://postgres:postgres@db:5432/os20
  SERVER_URL: ${OS20_SERVER_URL:-http://localhost:3010}
  FRONT_BASE_URL: ${OS20_SERVER_URL:-http://localhost:3010}
  REDIS_URL: redis://redis:6379
  SKIP_AUTH: "true"
  APP_SECRET: ${APP_SECRET:?APP_SECRET is missing. Run install.sh or npx os20-cli, which generate .env}
  PGDB_ENCRYPTION_KEY: ${PGDB_ENCRYPTION_KEY:-}
  STORAGE_TYPE: local
  ALLOW_PRIVATE_EMAIL_HOSTS: "true"
  # Workflow code steps run in-process (not sandboxed): they can read this
  # container's environment, including APP_SECRET. Kept on because the two
  # prefilled workflows use code steps. Set to DISABLED if you do not need them.
  LOGIC_FUNCTION_TYPE: LOCAL
  # The AI code interpreter has no sandbox locally, so it stays off.
  CODE_INTERPRETER_TYPE: DISABLED
  # Set to "false" to let workflow HTTP steps reach services on your network.
  OUTBOUND_HTTP_SAFE_MODE_ENABLED: ${OUTBOUND_HTTP_SAFE_MODE_ENABLED:-true}
  # Extra hostnames allowed to open OS20 without login. Only for a reverse
  # proxy that already requires its own authentication.
  OS20_ALLOWED_HOSTS: ${OS20_ALLOWED_HOSTS:-}
  OS20_LEADGEN_URL: http://os20-leadgen:8120
  OS20_LEADGEN_TOKEN: ${OS20_LEADGEN_TOKEN:?OS20_LEADGEN_TOKEN is missing. Re-run install.sh or npx os20-cli, which add it to .env}
  # Checks GitHub Releases twice a day for a newer OS20 version. Only the version
  # number is fetched; nothing about you is sent. Set to "false" to turn it off.
  OS20_UPDATE_CHECK: ${OS20_UPDATE_CHECK:-true}
  OS20_UPDATE_REPO: ${OS20_UPDATE_REPO:-omyvnss/os20}

services:
  os20:
    image: ghcr.io/omyvnss/os20:latest
    # Lets the container reach Ollama on the host (needed on Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3010:3000"
    environment:
      <<: *os20-env
      NODE_PORT: 3000
      DISABLE_DB_MIGRATIONS: ""
      DISABLE_CRON_JOBS_REGISTRATION: ""
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - os20-data:/app/packages/twenty-server/.local-storage
    healthcheck:
      test: curl --fail http://localhost:3000/healthz || exit 1
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  os20-worker:
    image: ghcr.io/omyvnss/os20:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: node /app/packages/twenty-server/dist/queue-worker/queue-worker.js
    working_dir: /app/packages/twenty-server
    environment:
      <<: *os20-env
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    depends_on:
      os20:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - os20-data:/app/packages/twenty-server/.local-storage
    restart: unless-stopped

  os20-leadgen:
    image: ghcr.io/omyvnss/os20-leadgen:latest
    # No host port: the server reaches it at http://os20-leadgen:8120 on the
    # Docker network. Check it with: docker compose exec os20-leadgen python -c
    # "import urllib.request as u; print(u.urlopen('http://localhost:8120/health').read())"
    environment:
      PYTHONPATH: /app
      OS20_LEADGEN_TOKEN: ${OS20_LEADGEN_TOKEN:?OS20_LEADGEN_TOKEN is missing. Re-run install.sh or npx os20-cli, which add it to .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8120/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      os20:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    volumes:
      - db-data:/var/lib/postgresql/data
    # No host port: only the app containers talk to the database. For a local
    # shell use: docker compose exec db psql -U postgres -d os20
    # The postgres/postgres login is kept because existing volumes were created
    # with it; changing it here would lock upgraded installs out of their data.
    environment:
      POSTGRES_DB: os20
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: pg_isready -U postgres -h localhost -d postgres
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # No host port: Redis has no password and only the app containers need it.
    restart: unless-stopped
    command: ["--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  os20-data:
