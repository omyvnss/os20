name: os20

services:
  os20:
    image: ghcr.io/omyvnss/os20:latest
    ports:
      - "3010:3000"
    environment:
      NODE_ENV: development
      NODE_PORT: 3000
      PG_DATABASE_URL: postgres://postgres:postgres@db:5432/os20
      SERVER_URL: http://localhost:3010
      REDIS_URL: redis://redis:6379
      SKIP_AUTH: "true"
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-os20-local-dev-secret-change-in-production}
      LOGIN_TOKEN_SECRET: ${LOGIN_TOKEN_SECRET:-os20-local-login-secret-change-in-production}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-os20-local-refresh-secret-change-in-production}
      FILE_TOKEN_SECRET: ${FILE_TOKEN_SECRET:-os20-local-file-secret-change-in-production}
      PGDB_ENCRYPTION_KEY: ${PGDB_ENCRYPTION_KEY:-os20-local-encryption-key-change}
      APP_SECRET: ${APP_SECRET:-os20-local-app-secret}
      FRONT_BASE_URL: http://localhost:3010
      STORAGE_TYPE: local
      DISABLE_DB_MIGRATIONS: ""
      DISABLE_CRON_JOBS_REGISTRATION: ""
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - os20-data:/app/packages/twenty-server/.local-storage
    healthcheck:
      test: curl --fail http://localhost:3000/healthz || curl --fail http://localhost:3000 || exit 1
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  os20-worker:
    image: ghcr.io/omyvnss/os20:latest
    command: node dist/queue-worker/queue-worker
    environment:
      NODE_ENV: development
      PG_DATABASE_URL: postgres://postgres:postgres@db:5432/os20
      SERVER_URL: http://localhost:3010
      REDIS_URL: redis://redis:6379
      SKIP_AUTH: "true"
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:-os20-local-dev-secret-change-in-production}
      LOGIN_TOKEN_SECRET: ${LOGIN_TOKEN_SECRET:-os20-local-login-secret-change-in-production}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET:-os20-local-refresh-secret-change-in-production}
      FILE_TOKEN_SECRET: ${FILE_TOKEN_SECRET:-os20-local-file-secret-change-in-production}
      PGDB_ENCRYPTION_KEY: ${PGDB_ENCRYPTION_KEY:-os20-local-encryption-key-change}
      APP_SECRET: ${APP_SECRET:-os20-local-app-secret}
      FRONT_BASE_URL: http://localhost:3010
      STORAGE_TYPE: local
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - os20-data:/app/packages/twenty-server/.local-storage
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: os20
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: pg_isready -U postgres -h localhost -d postgres
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    restart: unless-stopped
    command: ["--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  os20-data:
