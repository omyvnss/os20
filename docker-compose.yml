name: os20

# Secrets come from .env next to this file (install.sh and the CLI generate it).
# APP_SECRET signs sessions and encrypts stored API keys: never change it after
# the first start, or saved keys can no longer be decrypted.
x-os20-env: &os20-env
  NODE_ENV: development
  PG_DATABASE_URL: postgres://postgres:postgres@db:5432/os20
  SERVER_URL: ${OS20_SERVER_URL:-http://localhost:3010}
  FRONT_BASE_URL: ${OS20_SERVER_URL:-http://localhost:3010}
  REDIS_URL: redis://redis:6379
  SKIP_AUTH: "true"
  APP_SECRET: ${APP_SECRET:?APP_SECRET is missing. Run install.sh or npx os20-cli, which generate .env}
  PGDB_ENCRYPTION_KEY: ${PGDB_ENCRYPTION_KEY:-}
  STORAGE_TYPE: local
  ALLOW_PRIVATE_EMAIL_HOSTS: "true"
  # Workflow code steps run in-process; explicit so NODE_ENV never disables them.
  LOGIC_FUNCTION_TYPE: LOCAL
  # Set to "false" to let workflow HTTP steps reach services on your network.
  OUTBOUND_HTTP_SAFE_MODE_ENABLED: ${OUTBOUND_HTTP_SAFE_MODE_ENABLED:-true}
  # Extra hostnames allowed to open OS20 without login. Only for a reverse
  # proxy that already requires its own authentication.
  OS20_ALLOWED_HOSTS: ${OS20_ALLOWED_HOSTS:-}
  OS20_LEADGEN_URL: http://os20-leadgen:8120
  OS20_LEADGEN_TOKEN: ${OS20_LEADGEN_TOKEN:-}

services:
  os20:
    image: ghcr.io/omyvnss/os20:latest
    # Lets the container reach Ollama on the host (needed on Linux).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3010:3000"
    environment:
      <<: *os20-env
      NODE_PORT: 3000
      DISABLE_DB_MIGRATIONS: ""
      DISABLE_CRON_JOBS_REGISTRATION: ""
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - os20-data:/app/packages/twenty-server/.local-storage
    healthcheck:
      test: curl --fail http://localhost:3000/healthz || exit 1
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  os20-worker:
    image: ghcr.io/omyvnss/os20:latest
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: node /app/packages/twenty-server/dist/queue-worker/queue-worker.js
    working_dir: /app/packages/twenty-server
    environment:
      <<: *os20-env
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    depends_on:
      os20:
        condition: service_healthy
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - os20-data:/app/packages/twenty-server/.local-storage
    restart: unless-stopped

  os20-leadgen:
    image: ghcr.io/omyvnss/os20-leadgen:latest
    ports:
      - "127.0.0.1:8120:8120"
    environment:
      PYTHONPATH: /app
      OS20_LEADGEN_TOKEN: ${OS20_LEADGEN_TOKEN:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8120/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      os20:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: os20
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: pg_isready -U postgres -h localhost -d postgres
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6380:6379"
    restart: unless-stopped
    command: ["--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
  os20-data:
